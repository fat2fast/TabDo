name: Deploy UAT

on:
  push:
    branches: [uat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabdo-uat-deployment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Public, inert values required by WXT during install and by client builds.
      VITE_SUPABASE_URL: https://tabdo-ci.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-public-publishable-key
      VITE_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Seed safety check
        run: pnpm seed:local:safety

      - name: Build
        run: pnpm build

  deploy-supabase:
    name: Deploy Supabase (UAT)
    if: github.ref == 'refs/heads/uat'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: uat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Apply UAT database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_UAT_DB_PASSWORD }}
          SUPABASE_UAT_PROJECT_REF: ${{ secrets.SUPABASE_UAT_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_UAT_PROJECT_REF"
          supabase migration list --linked
          supabase db push --linked --yes

      - name: Deploy Supabase Edge Functions to UAT
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_UAT_PROJECT_REF: ${{ secrets.SUPABASE_UAT_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy admin-create-user \
            --project-ref "$SUPABASE_UAT_PROJECT_REF"
          supabase functions deploy admin-users \
            --project-ref "$SUPABASE_UAT_PROJECT_REF"
          supabase functions deploy complete-initial-password \
            --project-ref "$SUPABASE_UAT_PROJECT_REF"
          supabase functions deploy purge-deleted-tasks \
            --project-ref "$SUPABASE_UAT_PROJECT_REF"

      - name: Report Supabase UAT deployment
        env:
          SUPABASE_UAT_PROJECT_REF: ${{ secrets.SUPABASE_UAT_PROJECT_REF }}
        run: |
          {
            printf '### UAT Supabase deployment\n\n'
            printf '%s\n' "- Commit: \`$GITHUB_SHA\`"
            printf '%s\n' "- Target Project Ref: \`${SUPABASE_UAT_PROJECT_REF:0:6}...\`"
            printf '%s\n' '- Supabase migration history inspected; pending migrations applied successfully.'
            printf '%s\n' '- Supabase Edge Functions (\`admin-create-user\`, \`admin-users\`, \`complete-initial-password\`, \`purge-deleted-tasks\`) deployed successfully.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-vercel:
    name: Deploy Vercel (UAT)
    if: github.ref == 'refs/heads/uat'
    needs: [validate, deploy-supabase]
    runs-on: ubuntu-latest
    environment:
      name: uat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Install dependencies
        env:
          VITE_SUPABASE_URL: https://tabdo-ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-public-publishable-key
          VITE_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@63.0.2

      - name: Pull UAT project build settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --cwd apps/web \
            --token "$VERCEL_TOKEN"

      - name: Check UAT build configuration
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SUPABASE_UAT_PROJECT_REF: ${{ secrets.SUPABASE_UAT_PROJECT_REF }}
        run: |
          set -euo pipefail
          pnpm check:uat:config

      - name: Build UAT web deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TABDO_EXPECT_PRODUCTION_BUILD: '1'
        run: |
          set -euo pipefail
          vercel build --prod --cwd apps/web --token "$VERCEL_TOKEN"

      - name: Verify build artifacts target UAT
        env:
          SUPABASE_UAT_PROJECT_REF: ${{ secrets.SUPABASE_UAT_PROJECT_REF }}
        run: |
          set -euo pipefail
          grep -rq "https://${SUPABASE_UAT_PROJECT_REF}.supabase.co" apps/web/.vercel/output/static || {
            echo "Error: UAT Supabase URL not found in built static assets"
            exit 1
          }
          if grep -rqE "tabdo-ci\.invalid|127\.0\.0\.1:54321|localhost:54321|http://127\.0\.0\.1" apps/web/.vercel/output/static; then
            echo "Error: Local or invalid placeholder URL found in built static assets"
            exit 1
          fi

      - name: Deploy UAT web and check SPA route
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_UAT_PROJECT_REF: ${{ secrets.SUPABASE_UAT_PROJECT_REF }}
        run: |
          set -euo pipefail
          deployment_output="$(vercel deploy --prebuilt --prod --cwd apps/web \
            --token "$VERCEL_TOKEN")"
          # Extract the primary URL from the deployment output
          deployment_url="$(printf '%s\n' "$deployment_output" | grep -Eo 'https://[^ ]+' | tail -n 1)"
          if [ -z "$deployment_url" ]; then
            deployment_url="${deployment_output##*$'\n'}"
          fi
          deployment_url="${deployment_url%/}"
          echo "Deployment target: $deployment_url"

          # Verify SPA route with retry loop to allow Vercel Edge CDN propagation
          verify_spa_route() {
            local target_url="$1"
            local max_attempts=10
            local wait_seconds=3
            local attempt=1

            echo "Verifying SPA route: $target_url"
            while [ "$attempt" -le "$max_attempts" ]; do
              local body
              if body="$(curl --fail --location --silent --show-error "$target_url" 2>/dev/null)" && \
                 printf '%s' "$body" | grep --fixed-strings --quiet '<div id="root"></div>'; then
                echo "Route check passed: $target_url (attempt $attempt)"
                return 0
              fi

              echo "Attempt $attempt/$max_attempts: $target_url not ready yet (status 404 or propagating). Waiting ${wait_seconds}s..."
              sleep "$wait_seconds"
              attempt=$((attempt + 1))
            done

            echo "Error: SPA route verification failed after $max_attempts attempts: $target_url"
            curl --fail --location --show-error "$target_url"
            return 1
          }

          verify_spa_route "$deployment_url/login"
          verify_spa_route "$deployment_url/tasks"

          {
            printf '### UAT Vercel deployment\n\n'
            printf '%s\n' "- Commit: \`$GITHUB_SHA\`"
            printf '%s\n' "- Deployment: $deployment_url"
            printf '%s\n' "- Target Project Ref: \`${SUPABASE_UAT_PROJECT_REF:0:6}...\`"
            printf '%s\n' '- \`/login\` and \`/tasks\` returned the SPA entry document.'
          } >> "$GITHUB_STEP_SUMMARY"
